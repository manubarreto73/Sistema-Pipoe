server:
  port: 8080
  # Detrás de nginx, Spring ve la conexión como HTTP y con la IP del proxy. Esto le dice que
  # reconstruya el esquema y el host reales a partir de las cabeceras X-Forwarded-*.
  # Que la IP del cliente sea confiable depende además de TRUST_PROXY (ver security.rate-limit).
  forward-headers-strategy: framework

spring:
  application:
    name: pipoe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipoe-api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # En producción Redis arranca con requirepass. Vacío en desarrollo, donde escucha
      # sólo en localhost. Sin contraseña, cualquiera en la red lee los refresh tokens.
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Sonda de salud, y nada más que eso. El resto de los endpoints de Actuator —env, beans,
# configprops, heapdump— filtran variables de entorno y estructura interna, así que no se
# exponen. show-details: never porque /actuator/health es público: decir "falla la base de
# datos, host db:5432" es regalarle un mapa a quien esté probando.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

      # Lo que mira el healthcheck del contenedor y el monitoreo: "puedo atender pedidos".
      # Sin base o sin Redis la respuesta es no; sin correo, sí — se cae el alta de usuarios,
      # no el servicio.
      group:
        readiness:
          include: readinessState, db, redis

  health:
    # El chequeo de correo de Spring abre una conexion SMTP de verdad en CADA consulta de
    # salud. Con la sonda cada 15 segundos serian miles de conexiones por dia contra el
    # proveedor de envio, que las toma como abuso. Ademas dejaba la API entera en DOWN por
    # una caida del SMTP, cuando el sistema sigue sirviendo todo salvo el alta de usuarios.
    mail:
      enabled: false

app:
  mail:
    from: ${MAIL_FROM:no-reply@modelopipoe.com}

  # Historial de documentos. El editor guarda solo cada 2,5 segundos de inactividad, así que sin
  # estas dos reglas una tarde de escritura deja cientos de entradas casi iguales.
  historial:
    # Silencio que corta una sesión de escritura: alguien que se fue y volvió arranca una
    # entrada nueva en vez de estirar la anterior.
    sesion-hueco-minutos: 30
    # Tope de duración de una sesión, para que un día entero de trabajo no quede en una sola
    # entrada cuyo diff es el documento completo.
    sesion-maxima-horas: 4
    # Días con todos los guardados antes de que la poda nocturna deje uno por autor y por día.
    dias-completos: 3

  # Primer administrador. Sólo se crea si la base no tiene ningún ADMIN (ver AdminBootstrap).
  # Sin estas variables, una base recién migrada queda sin forma de entrar.
  admin-inicial:
    email: ${ADMIN_INICIAL_EMAIL:}
    password: ${ADMIN_INICIAL_PASSWORD:}
    nombre: ${ADMIN_INICIAL_NOMBRE:Administrador}

security:
  jwt:
    # Obligatorio: setear JWT_SECRET_KEY como variable de entorno (mínimo 256 bits, Base64).
    # Dejar vacío para que la app falle al arrancar si no está configurado.
    secret-key: ${JWT_SECRET_KEY:}
    expiration-time: 900000        # 15 min (ms) — access token
    refresh-expiration-days: 7

  cors:
    # Default de desarrollo: el dev server de Vite del frontend (front/vite.config.ts fija strictPort).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  rate-limit:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    # Tope por cuenta, además del tope por IP: sin esto, un atacante con muchas direcciones
    # puede seguir probando contra la misma cuenta sin cruzar nunca el límite por IP.
    max-login-attempts-cuenta: ${MAX_LOGIN_ATTEMPTS_CUENTA:10}
    attempts-window-minutes: ${LOGIN_ATTEMPTS_WINDOW_MIN:5}
    block-duration-minutes: ${LOGIN_BLOCK_DURATION_MIN:30}

    # Si se confía o no en la cabecera X-Forwarded-For para saber la IP de quien llama.
    # Activar SÓLO cuando haya un proxy delante que la pise con la IP real de la conexión.
    # En true sin ese proxy, cualquiera manda la cabecera que quiera, cambia de "IP" en cada
    # intento y el bloqueo por intentos fallidos deja de servir para nada.
    trust-proxy: ${TRUST_PROXY:false}

    # POST /api/solicitudes-acceso es público: tope de solicitudes por IP y ventana.
    max-solicitudes-acceso: ${MAX_SOLICITUDES_ACCESO:3}
    solicitudes-window-minutes: ${SOLICITUDES_WINDOW_MIN:60}
