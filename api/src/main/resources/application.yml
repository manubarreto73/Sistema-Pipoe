server:
  port: 8080
  # Detrás de nginx, Spring ve la conexión como HTTP y con la IP del proxy. Esto le dice que
  # reconstruya el esquema y el host reales a partir de las cabeceras X-Forwarded-*.
  # Que la IP del cliente sea confiable depende además de TRUST_PROXY (ver security.rate-limit).
  forward-headers-strategy: framework

spring:
  application:
    name: pipoe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pipoe-api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # En producción Redis arranca con requirepass. Vacío en desarrollo, donde escucha
      # sólo en localhost. Sin contraseña, cualquiera en la red lee los refresh tokens.
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Sonda de salud, y nada más que eso. El resto de los endpoints de Actuator —env, beans,
# configprops, heapdump— filtran variables de entorno y estructura interna, así que no se
# exponen. show-details: never porque /actuator/health es público: decir "falla la base de
# datos, host db:5432" es regalarle un mapa a quien esté probando.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  mail:
    from: ${MAIL_FROM:no-reply@pipoe.com}

  # Primer administrador. Sólo se crea si la base no tiene ningún ADMIN (ver AdminBootstrap).
  # Sin estas variables, una base recién migrada queda sin forma de entrar.
  admin-inicial:
    email: ${ADMIN_INICIAL_EMAIL:}
    password: ${ADMIN_INICIAL_PASSWORD:}
    nombre: ${ADMIN_INICIAL_NOMBRE:Administrador}

security:
  jwt:
    # Obligatorio: setear JWT_SECRET_KEY como variable de entorno (mínimo 256 bits, Base64).
    # Dejar vacío para que la app falle al arrancar si no está configurado.
    secret-key: ${JWT_SECRET_KEY:}
    expiration-time: 900000        # 15 min (ms) — access token
    refresh-expiration-days: 7

  cors:
    # Default de desarrollo: el dev server de Vite del frontend (front/vite.config.ts fija strictPort).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  rate-limit:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    attempts-window-minutes: ${LOGIN_ATTEMPTS_WINDOW_MIN:5}
    block-duration-minutes: ${LOGIN_BLOCK_DURATION_MIN:30}

    # POST /api/solicitudes-acceso es público: tope de solicitudes por IP y ventana.
    max-solicitudes-acceso: ${MAX_SOLICITUDES_ACCESO:3}
    solicitudes-window-minutes: ${SOLICITUDES_WINDOW_MIN:60}
