<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Modelo PipoE">
  <!--
    Reducción del logotipo tipográfico de la aplicación (components/ui/Marca.tsx): la palabra en
    serif, azul, con la E en rojo. A 16 píxeles la palabra entera no se lee, así que quedan las
    dos mayúsculas con los colores intactos.

    Fondo claro y no azul lleno: el rojo #c12026 sobre el azul #1a4691 son dos tonos oscuros y
    a tamaño de pestaña se funden en una mancha. Sobre el celeste de marca los dos contrastan.

    Es provisorio, igual que la marca: cuando exista un logo del Modelo PipoE se reemplaza acá.
  -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#f0f4fb" stroke="#1a4691" stroke-width="3"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Alegreya, Georgia, 'Times New Roman', serif"
        font-size="36" font-weight="700" letter-spacing="-1">
    <tspan fill="#1a4691">P</tspan><tspan fill="#c12026">E</tspan>
  </text>
</svg>
