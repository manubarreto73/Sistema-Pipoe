# nginx sirve el front y, en la misma dirección, proxea /api a la API. Un solo origen para
# todo: no hay CORS, no hay segundo certificado, y la misma imagen sirve para cualquier
# ambiente porque el front pide las rutas relativas.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Que no anuncie la versión de nginx en cada respuesta ni en las páginas de error.
    server_tokens off;

    # El DNS interno de Docker. Hace falta declararlo porque nginx, si el destino está escrito
    # como texto fijo, resuelve el nombre UNA sola vez al arrancar y se queda con esa IP para
    # siempre. Al redesplegar la API el contenedor nuevo recibe otra IP y nginx sigue yendo a
    # la vieja: todo el sitio devuelve 502 hasta reiniciarlo. Con el resolver declarado y el
    # destino en una variable, nginx vuelve a preguntar cada 10 segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # --- La API -------------------------------------------------------------------------
    location /api/ {
        set $api_destino http://api:8080;
        proxy_pass $api_destino$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # $remote_addr y NO $proxy_add_x_forwarded_for: pisa cualquier X-Forwarded-For que
        # mande el cliente. Con la variante que concatena, un atacante pone su propio valor
        # primero, rota su "IP" en cada intento y el bloqueo por intentos fallidos se vuelve
        # inútil. Cuando haya Cloudflare adelante, acá va $http_cf_connecting_ip.
        proxy_set_header X-Forwarded-For   $remote_addr;

        # Los documentos del editor son texto; 2 MB es holgado. La API además valida el
        # tamaño del contenido, pero esto lo corta antes de gastar memoria de aplicación.
        client_max_body_size 2m;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # --- Sonda de salud -----------------------------------------------------------------
    # Se expone sólo el health, no el resto de Actuator.
    location = /actuator/health {
        set $api_destino http://api:8080;
        proxy_pass $api_destino/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # --- Archivos estáticos -------------------------------------------------------------
    # Los assets llevan un hash en el nombre: si cambia el contenido, cambia el nombre. Por
    # eso se pueden cachear un año sin riesgo de servir una versión vieja.
    location /assets/ {
        # Una sola cabecera: `expires` tambien escribe Cache-Control, asi que combinarlo con
        # add_header hacia que la respuesta viajara con las dos.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html es la excepción: es el que apunta a los assets nuevos. Si se cachea, el
    # navegador sigue pidiendo los archivos de la versión anterior después de un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
    }

    # Sin este fallback, apretar F5 en /proyectos devuelve 404: esa ruta sólo existe dentro
    # del router de React, nginx no sabe nada de ella.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/cabeceras-seguridad.inc;
    }
}
